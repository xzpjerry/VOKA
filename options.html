<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VOKA</title>
  </head>
  <body>
    <main>
      <h1>VOKA</h1>
      <form>
        <label
          ><span data-i18n="port"></span
          ><input id="port" type="number" min="1" max="65535" required /></label
        ><label
          ><span data-i18n="apiKey"></span
          ><input id="apiKey" type="password" autocomplete="off" /></label
        ><button data-i18n="saveCheck"></button>
      </form>
      <p role="status" id="status"></p>
      <section>
        <label
          ><span data-i18n="nativeLanguage"></span
          ><select id="nativeLanguage">
            <option value="zh">中文</option>
            <option value="en">English</option>
          </select></label
        >
        <label id="glossLanguageRow"
          ><span data-i18n="glossLanguage"></span
          ><select id="glossLanguage">
            <option value="native" data-i18n="glossNative"></option>
            <option value="target" data-i18n="glossTarget"></option></select
        ></label>
      </section>
      <section>
        <h2 data-i18n="importTitle"></h2>
        <p data-i18n="importPromise"></p>
        <p data-i18n="importDaily"></p>
        <button id="preview" type="button" data-i18n="importPreview"></button>
        <button
          id="confirm"
          type="button"
          data-i18n="importConfirm"
          disabled
        ></button>
        <pre
          id="importStatus"
          role="status"
          style="white-space: pre-wrap"
        ></pre>
      </section>
    </main>
    <script type="module" src="/src/options.ts"></script>
  </body>
</html>
