<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VOKA</title>
  </head>
  <body>
    <main>
      <h1>VOKA</h1>

    </main>
    <script type="module" src="/src/options.ts"></script>
  </body>
</html>
